name: Generate Sitemap

on:
  push:
    branches: [ main ]  # or 'master' if that's your default branch

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: 'https://emerald-education-platform.github.io'
          include-robots: false

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Auto-generated sitemap [skip ci]')
          # Set remote URL with token
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push
